services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  app:
    build:
      context: ./app
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      COLLECTION_NAME: tw_listed_companies
      MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EXCEL_PATH: /workspace/data/台灣上市公司_100家_10產業_含簡介.xlsx
    volumes:
      - ./data:/workspace/data:ro
      - model_cache:/root/.cache  # cache HF models
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
  model_cache:
